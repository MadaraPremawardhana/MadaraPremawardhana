name: 3D contribution graph

on:
  schedule:
    # Runs daily at 18:00 UTC. Change if you want a different refresh time.
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Generates several SVGs into ./profile-3d-contrib/
      # Check https://github.com/yoshi389111/github-profile-3d-contrib
      # for the newest version tag and bump it here.
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Regenerate 3D contribution graph" || exit 0
          git push
